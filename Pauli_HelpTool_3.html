<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚐 Pauli Help Tool</title>
<style>
  :root {
    --bg: #f5f4f0;
    --card: #ffffff;
    --border: #e2e0d8;
    --text: #1a1a18;
    --muted: #6b6b65;
    --accent: #1a6fb5;
    --accent-bg: #e8f0f9;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --success: #166534;
    --success-bg: #dcfce7;
    --danger: #991b1b;
    --danger-bg: #fee2e2;
    --google: #1a7340;
    --google-bg: #e8f5ee;
    --google-border: #a7d7bc;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  .top-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; gap: 12px; height: 56px; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 8px rgba(0,0,0,0.06); }
  .top-bar .logo { font-size: 24px; }
  .top-bar h1 { font-size: 17px; font-weight: 600; }
  .top-bar .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .main { max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .ask-card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.25rem; margin-bottom: 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .ask-row { display: flex; gap: 8px; }
  .ask-row input { flex: 1; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; color: var(--text); background: var(--bg); outline: none; transition: border .15s; }
  .ask-row input:focus { border-color: var(--accent); background: #fff; }

  .btn { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 6px; font-weight: 500; transition: all .15s; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--bg); }
  .btn-pauli { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-pauli:hover { background: #155fa0; border-color: #155fa0; }
  .btn-google { background: var(--google); color: #fff; border-color: var(--google); }
  .btn-google:hover { background: #155f34; border-color: #155f34; }
  .btn-mic { padding: 10px 13px; font-size: 18px; }
  .btn-mic.recording { background: var(--danger-bg); border-color: #fca5a5; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  .chips-section { margin-top: 1.1rem; }
  .chips-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: .5rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 6px 13px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all .15s; border: 1px solid; }
  .chip-pauli { border-color: #c0d4eb; color: var(--accent); background: var(--accent-bg); }
  .chip-pauli:hover, .chip-pauli.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip-google { border-color: var(--google-border); color: var(--google); background: var(--google-bg); }
  .chip-google:hover { background: var(--google); color: #fff; border-color: var(--google); }

  /* Ergebnis-Bereiche */
  .results-grid { display: flex; flex-direction: column; gap: 1rem; }

  .result-card { border-radius: var(--radius); border: 2px solid; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .result-card.pauli-card { border-color: var(--accent); }
  .result-card.google-card { border-color: var(--google); }

  .result-head { display: flex; align-items: center; gap: 10px; padding: .75rem 1.25rem; font-size: 13px; font-weight: 600; }
  .result-head.pauli-head { background: var(--accent-bg); color: var(--accent); border-bottom: 1px solid #c0d4eb; }
  .result-head.google-head { background: var(--google-bg); color: var(--google); border-bottom: 1px solid var(--google-border); }
  .result-head .source-icon { font-size: 16px; }

  .result-body { padding: 1.25rem; background: var(--card); }

  .result-empty { padding: 2rem 1.25rem; text-align: center; color: var(--muted); font-size: 14px; background: var(--card); }

  .phase-pill { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 20px; margin-left: auto; }
  .badge-vor { background: var(--warn-bg); color: var(--warn); }
  .badge-fahrt { background: var(--accent-bg); color: var(--accent); }
  .badge-platz { background: var(--success-bg); color: var(--success); }
  .badge-abfahrt { background: var(--danger-bg); color: var(--danger); }

  .answer-text { font-size: 14px; line-height: 1.85; color: var(--text); white-space: pre-wrap; }
  .warn-line { color: var(--warn); font-weight: 500; }

  /* Google Suchlinks */
  .google-links { display: flex; flex-direction: column; gap: 8px; }
  .google-link { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--google-border); background: var(--google-bg); text-decoration: none; color: var(--google); font-size: 13px; font-weight: 500; transition: all .15s; }
  .google-link:hover { background: var(--google); color: #fff; border-color: var(--google); }
  .google-link .link-icon { font-size: 15px; flex-shrink: 0; }
  .google-link .link-query { flex: 1; }
  .google-link .link-arrow { margin-left: auto; opacity: .6; }

  .no-result { padding: 1.5rem; text-align: center; color: var(--muted); font-size: 14px; }
  .no-result strong { display: block; font-size: 15px; margin-bottom: .3rem; color: var(--text); }

  @media (max-width: 520px) {
    .ask-row { flex-wrap: wrap; }
    .ask-row input { width: 100%; }
    .btn-pauli span, .btn-google span { display: none; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <span class="logo">🚐</span>
  <div>
    <h1>Pauli Help Tool</h1>
    <div class="sub">Pilote G720FGJ — offline + Internet</div>
  </div>
</div>

<div class="main">

        <button class="chip chip-pauli" data-id="platz-niveau">📐 Nivellierung</button>
        <button class="chip chip-pauli" data-id="platz-frischwasser">💧 Frischwasser</button>
        <button class="chip chip-pauli" data-id="platz-grauwasser">🚿 Grauwasser</button>
        <button class="chip chip-pauli" data-id="platz-pipi">🚽 Pipi-Box</button>
        <button class="chip chip-pauli" data-id="platz-heizung">🔥 Truma Heizung</button>
        <button class="chip chip-pauli" data-id="platz-bedienteil">🎛 Bedienteil</button>
        <button class="chip chip-pauli" data-id="platz-markise">⛱ Markise</button>
        <button class="chip chip-pauli" data-id="platz-strom">⚡ Landstrom</button>
        <button class="chip chip-pauli" data-id="platz-fenster">🪟 Fenster</button>
        <button class="chip chip-pauli" data-id="platz-wechselrichter">🔌 Wechselrichter</button>
        <button class="chip chip-pauli" data-id="platz-wc">🚽 WC</button>
        <button class="chip chip-pauli" data-id="platz-gas">🔵 Gasherd</button>
        <button class="chip chip-pauli" data-id="platz-cadac">🥩 Cadac Grill</button>
        <button class="chip chip-pauli" data-id="platz-klima">❄️ Klimaanlage</button>
        <button class="chip chip-pauli" data-id="platz-stuetzen">🔧 Kurbelstützen</button>
        <button class="chip chip-pauli" data-id="platz-teppich">🟩 Teppich</button>
        <button class="chip chip-pauli" data-id="rep-werkzeug">🛠 Werkzeug</button>
      </div>
    </div>

    <div class="chips-section" style="margin-top:.9rem">
      <div class="chips-label">🌐 Internet-Suche (öffnet Google)</div>
      <div class="chips">
        <button class="chip chip-google" onclick="openGoogle('Pilote G720FGJ Bedienungsanleitung')">📄 Bedienungsanleitung</button>
        <button class="chip chip-google" onclick="openGoogle('Pilote G720FGJ Truma Heizung Bedienung')">🔥 Truma Anleitung</button>
        <button class="chip chip-google" onclick="openGoogle('Pilote G720FGJ Markise ausfahren')">⛱ Markise Video</button>
        <button class="chip chip-google" onclick="openGoogle('Wohnmobil Wasseranlage winterfest machen')">❄️ Winterfest machen</button>
        <button class="chip chip-google" onclick="openGoogle('Pilote G720FGJ Forum Erfahrungen')">💬 Forum & Tipps</button>
        <button class="chip chip-google" onclick="openGoogle('Cadac Grillo Chef 40 Anleitung')">🥩 Cadac Anleitung</button>
        <button class="chip chip-google" onclick="openGoogle('Wohnmobil Campingplatz Stellplatz Tipps Schweiz')">🏕 Camping Schweiz</button>
        <button class="chip chip-google" onclick="openGoogle('Pilote G720FGJ technische Daten')">📐 Technische Daten</button>
      </div>
    </div>
  </div>

  <div class="results-grid" id="results">
    <div class="result-card pauli-card">
      <div class="result-head pauli-head">
        <span class="source-icon">📋</span> Pauli-Anleitung
      </div>
      <div class="result-empty">Thema wählen oder Stichwort eingeben und auf «Pauli-Anleitung» klicken.</div>
    </div>
    <div class="result-card google-card">
      <div class="result-head google-head">
        <span class="source-icon">🌐</span> Internet-Suche
      </div>
      <div class="result-empty">Stichwort eingeben und auf «Internet» klicken — oder einen grünen Chip wählen.</div>
    </div>
  </div>
</div>

  "platz-stuetzen": {
    phase:"Auf dem Platz", thema:"Kurbelstützen",
    tags:["kurbelstützen","stützen","kurbel","grüner schlauch","einrasten","lenkrad"],
    info:`🔧 Kurbel mit grünem Schlauch verwenden.

✅ Trick gegen Vergessen:
   Kurbel beim Lenkrad ablegen → Erinnerung für die Abfahrt!

Beim Hochdrehen: mit Schwung drehen damit die Stützen richtig einrasten.`
  },
  "platz-teppich": {
    phase:"Auf dem Platz", thema:"Teppich",
    tags:["teppich","auslegen","etikette","250","500","seite"],
    info:`🟩 Teppich: 250 × 500 cm.
   Grüne Etikette = Oberseite.
✅ Immer die gleiche Seite oben lassen — damit nur eine Seite dreckig wird.`
  },
  "rep-werkzeug": {
    phase:"Reparaturen", thema:"Werkzeugkiste",
    tags:["werkzeug","reparatur","kiste","klebeband","kabelbinder","garage"],
    info:`🛠 Werkzeugkiste: hinten in der Garage, fahrerseitig.
   Enthält: allgemeines Werkzeug, Kleberollen, Kabelbinder etc.`
  }
};

function phaseClass(p) {
  if(p.includes('Vor')) return 'badge-vor';
  if(p.includes('Fahrt')) return 'badge-fahrt';
  if(p.includes('Platz')) return 'badge-platz';
  return 'badge-abfahrt';
}

function norm(s) {
  return s.toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
}

function renderPauliResult(item) {
  const pc = phaseClass(item.phase);
  const lines = item.info.split('\n').map(line => {
    const esc = line.replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return line.startsWith('⚠️') ? `<span class="warn-line">${esc}</span>` : esc;
  }).join('\n');
  return `
    <div class="result-card pauli-card">
      <div class="result-head pauli-head">
        <span class="source-icon">📋</span>
        Pauli-Anleitung
        <span class="phase-pill ${pc}">${item.phase}</span>
      </div>
      <div class="result-body">
        <div style="font-size:16px;font-weight:600;margin-bottom:.75rem">${item.thema}</div>
        <div class="answer-text">${lines}</div>
      </div>
    </div>`;
}

function renderGoogleResult(query) {
  const base = 'https://www.google.com/search?q=';
  const queries = [
    { icon:'🔍', label: query + ' — Google-Suche', q: query },
    { icon:'▶️', label: query + ' — YouTube Videos', q: query + ' site:youtube.com' },
    { icon:'💬', label: query + ' — Forum & Erfahrungen', q: query + ' Forum Erfahrungen' },
  ];
  const links = queries.map(({icon, label, q}) =>
    `<a class="google-link" href="${base}${encodeURIComponent(q)}" target="_blank" rel="noopener">
      <span class="link-icon">${icon}</span>
      <span class="link-query">${label}</span>
      <span class="link-arrow">↗</span>
    </a>`
  ).join('');
  return `
    <div class="result-card google-card">
      <div class="result-head google-head">
        <span class="source-icon">🌐</span>
        Internet-Suche für «${query}»
      </div>
      <div class="result-body">
        <div class="google-links">${links}</div>
      </div>
    </div>`;
}

function showEntry(id) {
  document.querySelectorAll('.chip-pauli').forEach(c => c.classList.remove('active'));
  const chip = document.querySelector(`.chip-pauli[data-id="${id}"]`);
  if(chip) chip.classList.add('active');
  const item = KB[id];
  const googleQuery = 'Pilote G720FGJ ' + item.thema;
  document.getElementById('results').innerHTML =
    renderPauliResult(item) + renderGoogleResult(googleQuery);
}

function ask() {
  const q = document.getElementById('question').value.trim();
  if(!q) return;
  document.querySelectorAll('.chip-pauli').forEach(c => c.classList.remove('active'));
  const nq = norm(q);
  const words = nq.split(/[\s,?!.]+/).filter(w => w.length > 2);

  const scored = Object.entries(KB).map(([id, item]) => {
    let score = 0;
    const normTags = item.tags.map(norm);
    const normThema = norm(item.thema);
    words.forEach(w => {
      if(normTags.some(t => t === w || t.startsWith(w) || w.startsWith(t))) score += 10;
      else if(normThema.includes(w)) score += 6;
      else if(normTags.some(t => t.includes(w))) score += 3;
    });
    return {id, item, score};
  }).filter(x => x.score > 0).sort((a,b) => b.score - a.score);

  const googleQuery = 'Pilote G720FGJ ' + q;
  const googleHtml = renderGoogleResult(googleQuery);

  if(scored.length === 0) {
    document.getElementById('results').innerHTML = `
      <div class="result-card pauli-card">
        <div class="result-head pauli-head"><span class="source-icon">📋</span> Pauli-Anleitung</div>
        <div class="no-result"><strong>Nichts gefunden</strong>Versuche: Markise · Tempomat · Frischwasser · Heizung · Strom · WC</div>
      </div>` + googleHtml;
    return;
  }

  const best = scored[0].score;
  const top = scored.filter(x => x.score >= best * 0.8).slice(0, 2);

  if(top.length === 1) {
    document.getElementById('results').innerHTML = renderPauliResult(top[0].item) + googleHtml;
  } else {
    const items = top.map(({id, item}) => {
      const pc = phaseClass(item.phase);
      return `<div style="padding:.75rem 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="showEntry('${id}')">
        <span class="phase-pill ${pc}" style="margin-right:8px">${item.phase}</span>
        <span style="font-weight:600">${item.thema}</span>
        <span style="float:right;color:var(--muted);font-size:13px">→</span>
      </div>`;
    }).join('');
    document.getElementById('results').innerHTML = `
      <div class="result-card pauli-card">
        <div class="result-head pauli-head"><span class="source-icon">📋</span> Pauli-Anleitung — Meinst du…?</div>
        <div class="result-body">${items}</div>
      </div>` + googleHtml;
  }
}

function googleSearch() {
  const q = document.getElementById('question').value.trim();
  if(!q) { alert('Bitte zuerst ein Stichwort eingeben.'); return; }
  openGoogle('Pilote G720FGJ ' + q);
}

function openGoogle(query) {
  window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank', 'noopener');
}

// Chip-Klick Pauli
document.getElementById('chips-pauli').addEventListener('click', e => {
  const chip = e.target.closest('.chip-pauli');
  if(!chip) return;
  document.getElementById('question').value = '';
  showEntry(chip.dataset.id);
});

document.getElementById('question').addEventListener('keydown', e => { if(e.key === 'Enter') ask(); });

// Spracheingabe
const micBtn = document.getElementById('micBtn');
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'de-DE'; rec.continuous = false; rec.interimResults = false;
  let running = false;
  rec.onresult = e => {
    const t = e.results[0][0].transcript;
    document.getElementById('question').value = t;
    micBtn.classList.remove('recording');
    micBtn.textContent = '🎤';
    running = false;
    ask();
  };
  rec.onend = () => { micBtn.classList.remove('recording'); micBtn.textContent = '🎤'; running = false; };
  rec.onerror = () => { micBtn.classList.remove('recording'); micBtn.textContent = '🎤'; running = false; };
  micBtn.onclick = () => {
    if(running) { rec.stop(); }
    else { running = true; micBtn.classList.add('recording'); micBtn.textContent = '⏹'; rec.start(); }
  };
} else {
  micBtn.style.opacity = '.4';
  micBtn.style.cursor = 'not-allowed';
  micBtn.title = 'Spracheingabe nicht verfügbar (Chrome empfohlen)';
}
</script>
</body>
</html>
